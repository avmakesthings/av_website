      description: Face2Face v2.0 is an AR iOS app that offers users a glimpse into a speculative future, where interpersonal interactions are mediated by realtime facial detection and analysis. The piece was created using Unity, ARKit, Facebook data scraping and Amazon Rekognition & is the second of series of works titled 'Training Sets', which takes a critical position on the use of facial detection and analysis.
